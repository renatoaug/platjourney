name: On pull request

# Every pull request gets the same checks a contributor runs locally: lint, types, and every test
# suite with its coverage floor.
on:
  pull_request:

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true # a new push supersedes the run it replaced

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests and coverage
    runs-on: ubuntu-latest

    # The AI service refuses to start without these; the tests never reach a database or a model.
    env:
      SURREAL_PASS: ci
      AI_TOKEN: ci-token-for-tests-0123456789abcdef

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # uv reads services/ai/.python-version itself when it runs the service's commands.
      - uses: astral-sh/setup-uv@v7

      - run: bun install --frozen-lockfile

      - run: uv sync --frozen
        working-directory: services/ai

      - name: Lint
        run: bun run lint

      - name: Types
        run: bun run typecheck

      - name: Tests with coverage
        run: bun run test:coverage

  push-migration:
    name: Push migration on SurrealDB 3.0.5
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Start disposable database
        run: |
          docker run -d --rm --name push-migration -p 127.0.0.1:18183:8000 surrealdb/surrealdb:v3.0.5 start --user test --pass local-test-only memory
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:18183/health && exit 0
            sleep 1
          done
          exit 1
      - run: bun scripts/check-push-migration.ts
      - name: Stop disposable database
        if: always()
        run: docker rm -f push-migration || true
