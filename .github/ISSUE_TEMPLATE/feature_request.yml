name: Feature request
description: Propose something new for PlatJourney.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences on what the feature does for a player.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What players struggle with today, with a real example if you have one.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How it could work, from the player's point of view first.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve it, and why this one.
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this issue deliberately leaves for later.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: The checks that tell us it is done.
      value: |
        - [ ]
    validations:
      required: true
