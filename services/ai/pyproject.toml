[project]
name = "platjourney-ai"
version = "0.1.0"
description = "PlatJourney AI service: Nexo, guides, plans, recommendations and the deep guide search"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "cbor2>=6.1.5",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "openai>=3.22.1",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
platjourney-ai = "platjourney_ai.main:run"

[build-system]
requires = ["uv_build>=0.11.10,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC"]

[tool.ruff.format]
quote-style = "single"

[tool.pyright]
include = ["src", "tests", "evals"]
typeCheckingMode = "strict"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
