<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nexo evals</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<!-- The app's own design tokens, served by view.py. -->
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/view.css">
<!-- After view.css, which declares the layer order: the app's toast sits in ui, above base. -->
<link rel="stylesheet" href="/toast.css">
</head>
<body>
<main class="shell">
  <header>
    <img src="/assets/logo.svg" alt="">
    <span class="brand">plat<span>journey</span></span>
    <span class="subtle">evals</span>
    <span class="spacer"></span>
    <div class="lang">
      <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#globe"></use></svg>
      <button type="button" data-lang="pt">PT</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </header>

  <section class="hero">
    <div>
      <span class="tag" data-t="eyebrow"></span>
      <h1 data-t="headline">Nexo evals</h1>
      <p class="muted" data-t="intro"></p>
    </div>
    <div class="hero-art"><div class="orbit" aria-hidden="true"><div class="controller-keys"><span>△</span><span>○</span><span>×</span><span>□</span></div></div><img src="/assets/nexo-avatar.svg" alt="Nexo"><div id="overview" aria-live="polite"></div></div>
  </section>

  <div class="section-heading"><h2 data-t="suiteTitle">What do you want to evaluate?</h2><p data-t="suiteHint"></p></div>
  <div class="suites" id="suites"></div>

  <section class="workspace"><div class="workspace-top"><div><span class="tag" data-t="workspaceLabel"></span><h2 data-t="workspaceTitle">Evaluation history</h2></div><div class="tabs" role="tablist" aria-label="Evals">
    <button type="button" role="tab" aria-selected="true" data-tab="runs" data-t="runs"></button>
    <button type="button" role="tab" aria-selected="false" data-tab="questions" data-t="questions"></button>
    <button type="button" role="tab" aria-selected="false" data-tab="real" data-t="real"></button>
  </div>
  </div><div id="tab" role="tabpanel"></div></section>
</main>

<dialog id="confirm" aria-labelledby="confirm-title">
  <h3 id="confirm-title">Run</h3>
  <p class="muted" id="confirm-body"></p>
  <div class="row" style="justify-content: flex-end; margin-top: 16px">
    <button type="button" class="btn" id="confirm-cancel" data-t="cancel"></button>
    <button type="button" class="btn primary" id="confirm-go" data-t="run"></button>
  </div>
</dialog>

<dialog id="qdialog" class="wide" aria-labelledby="qdialog-title"></dialog>
<div id="toast-host"></div>

  const SUITES = ['retrieval', 'scope', 'answers']

    scope: [['message', 'message'], ['forbidden', 'forbidden', 'list'], ['max_chars', 'max_chars', 'number']],
    answers: [['game', 'game_name', 'game'], ['question', 'question'], ['reference', 'reference', 'text'], ['earned', 'earned', 'list'], ['avoid', 'avoid', 'lines']],
  }
  // What each suite cannot run without (its case model); the other fields have defaults.
  const REQUIRED = {
    retrieval: ['game', 'question', 'relevant'],
    scope: ['message', 'forbidden'],
    answers: ['game', 'question', 'reference'],
  }
  let lang = 'en'
  try {
    lang = localStorage.getItem('evals:lang') || (navigator.language.startsWith('pt') ? 'pt' : 'en')
  } catch {}
  const t = (key, vars = {}) => String(TEXT[lang][key] ?? key).replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? '')
  const icon = (name) => `<svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#${name}"></use></svg>`

  // The game picker, like the interests search in the app: a game is only ever picked from the
  // list and then shows as a chip; there is no free text.
  const gameMeta = (g) =>
    [g.platforms?.join(' · '), g.release_year, g.passages != null ? t('passages', { n: g.passages }) : ''].filter(Boolean).join(' · ')
  const cover = (g, cls) => (g.cover_url ? `<img class="${cls}" src="${esc(g.cover_url)}" alt="" loading="lazy">` : `<i class="${cls}"></i>`)
  const chipHtml = (g) => `${cover(g, 'chip-cover')}<span class="chip-text"><b>${esc(g.name)}</b>${gameMeta(g) ? `<small>${esc(gameMeta(g))}</small>` : ''}</span>
    <button type="button" class="pick-clear" aria-label="${t('changeGame')}" title="${t('changeGame')}">${icon('close')}</button>`
  function pickerHtml(kind, data) {
    const name = kind === 'gameref' ? data.name : data.game
    return `<div class="picker${name ? ' has-pick' : ''}" data-kind="${kind}">
      ${icon('search')}
      <input class="game-search" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-label="${t('searchGame')}" placeholder="${t('searchGame')}" autocomplete="off" ${name ? 'readonly' : ''}>
      <span class="pick-spin" aria-hidden="true"></span>
      <span class="pick-chip" ${name ? '' : 'hidden'}>${name ? chipHtml({ name }) : ''}</span>
      <input type="hidden" name="game" value="${esc(data.game ?? '')}"><input type="hidden" name="name" value="${esc(data.name ?? '')}">
      <div class="options" role="listbox" hidden></div>
      <p class="pick-error" hidden>${t('pickGame')}</p>
    </div>`
  }
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
  // 08/10/2026, 13:51:27 in Portuguese; Oct 8, 2026, 1:51:27 PM in English (the month spelled out, so
  // the day and the month never read swapped).
  // What a case expected, in the viewer's language. Scope cases store their rule (forbidden words and
  // a length); older runs only have it as English text, read back here.
  function expectedText(c) {
    let rule = c.extra?.forbidden ? { forbidden: c.extra.forbidden, max: c.extra.max_chars } : null
    const old = !rule && /^no (.*); at most (\d+) chars$/.exec(c.expected || '')
    if (old) rule = { forbidden: old[1].split(', '), max: Number(old[2]) }
    if (!rule) return c.expected || '—'
    return [rule.forbidden.length ? `${t('mustNot')}: ${rule.forbidden.map((w) => `“${w}”`).join(', ')}` : '', rule.max ? t('atMost', { n: rule.max }) : '']
      .filter(Boolean)
      .join('\n')
  }

  // The score now and before; a suite without scores (scope) compares the verdicts instead.
  function scoreLine(c, o) {
    const verdict = (x) => t(x.passed ? 'approved' : 'rejected')
    const scored = c.score != null || o?.score != null
    const before = !other ? '' : !o ? t('new') : `${t('before')} ${scored ? num(o.score) : verdict(o).toLowerCase()}`
    const line = [scored ? `${t('score')} ${num(c.score)}` : '', before].filter(Boolean).join(' · ')
    return line ? `<span class="subtle">${line}</span>` : ''
  }
  const when = (iso) =>
    iso
      ? new Date(iso).toLocaleString(lang === 'pt' ? 'pt-BR' : 'en-US', lang === 'pt' ? undefined : { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit', second: '2-digit' })
      : ''
  const usd = (n) => `US$ ${Number(n || 0).toFixed(n && n < 0.1 ? 4 : 2)}`
  const plain = (id) => String(id).split(':').pop()
  const num = (n) => (n == null ? '—' : Number(n) % 1 ? Number(n).toFixed(2) : String(n))
  const api = async (path, opts) => {
    const r = await fetch(path, opts && { method: opts.method, headers: { 'content-type': 'application/json' }, body: JSON.stringify(opts.body) })
    if (!r.ok) throw new Error(await r.text())
    return r.json()
  }

  let suites = []
  let runs = []

  const RUNS_PAGE = 5
  let runPage = 1
  let current = null
  let other = null
  let onlyChanges = false
  let qsuite = 'answers'
  let editing = null
  let qlist = []
  let realList = null
  let realFilter = 'all'
  const realOpen = new Set()
  const realFound = {}

  // Adding and editing a question happen in a modal over the list.
  // A draft fills a new question (a real question taken to the eval); it is saved as new.
  function openQuestion(id, draft = null) {
    editing = id
    const d = document.getElementById('qdialog')
    d.innerHTML = questionForm(id === 'new' ? draft : qlist.find((q) => plain(q.id) === id))
    d.showModal()
    d.querySelector('.game-search:not([readonly]), input:not([type=hidden]), textarea')?.focus()
    // A saved question keeps only the game's name or id: fetch the rest (cover, platforms) for the chip.
    const ref = d.querySelector('.picker.has-pick [name=game]')?.value
    if (ref)
      api(`/api/game?ref=${encodeURIComponent(ref)}`)
        .then((g) => {
          const chip = d.querySelector('.picker.has-pick .pick-chip')
          if (g && chip && editing === id) chip.innerHTML = chipHtml(g)
        })
        .catch(() => {})
  }

  function closeQuestion() {
    const d = document.getElementById('qdialog')
    if (d.open) d.close()
  }

  function translateStatic() {
    document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en'
    for (const el of document.querySelectorAll('[data-t]')) el.textContent = t(el.dataset.t)
    for (const b of document.querySelectorAll('[data-lang]')) b.setAttribute('aria-pressed', b.dataset.lang === lang)
  }

  // Each tab says how much it holds: runs so far, questions asked across the suites.
  function drawTabs() {
    const counts = { runs: runs.length, questions: suites.reduce((n, s) => n + s.questions, 0), real: realList ? realList.length : '' }
    for (const b of document.querySelectorAll('[data-tab]')) {
      b.innerHTML = `${t(b.dataset.tab)}${suites.length ? `<span class="count">${counts[b.dataset.tab]}</span>` : ''}`
    }
  }

  function drawOverview() {
    const latest = runs.find((r) => r.status === 'done' && r.total > 0)
    document.getElementById('overview').innerHTML = latest
      ? `<span class="status-dot" aria-hidden="true"></span><span>${t('latest')}<strong>${Math.round(latest.passed / latest.total * 100)}% · ${esc(TEXT[lang].suites[latest.suite]?.[0] ?? latest.suite)}</strong></span>`
      : `<span class="status-dot" aria-hidden="true"></span><span>${t('ready')}<strong>${t('readyHint')}</strong></span>`
  }

  const suiteHeights = { closed: 0, open: 0 }

  function applySuiteHeights() {
    for (const card of document.querySelectorAll('#suites .suite')) {
      card.style.minHeight = `${card.querySelector('details')?.open ? suiteHeights.open : suiteHeights.closed}px`
    }
  }

  // Measure both states off screen, so opening one card never stretches its closed siblings.
  function equalizeSuites() {
    const source = document.getElementById('suites')
    if (!source.children.length) return
    const measure = source.cloneNode(true)
    measure.removeAttribute('id')
    measure.inert = true
    measure.setAttribute('aria-hidden', 'true')
    Object.assign(measure.style, {
      position: 'absolute', visibility: 'hidden', left: '0', top: '0',
      width: `${source.getBoundingClientRect().width}px`,
    })
    for (const card of measure.querySelectorAll('.suite')) {
      card.style.minHeight = '0'
      card.classList.remove('fade')
    }
    document.body.append(measure)
    for (const state of ['closed', 'open']) {
      for (const details of measure.querySelectorAll('details')) details.open = state === 'open'
      suiteHeights[state] = Math.ceil(Math.max(0, ...[...measure.children].map((card) => card.getBoundingClientRect().height)))
    }
    measure.remove()
    applySuiteHeights()
  }

  document.getElementById('suites').addEventListener('toggle', applySuiteHeights, true)

  function drawSuites() {
    drawOverview()
    document.getElementById('suites').innerHTML = suites
      .map((s, i) => {
        const [title, text, tests, passes, shows] = TEXT[lang].suites[s.suite]
        return `<article class="suite fade">
          <div class="suite-index"><span>0${i + 1}</span><span>${t('mission', { n: String(i + 1).padStart(2, '0') })} / ${esc(s.suite)}</span></div><h3>${title}</h3>
          <p>${text}</p>
          <details><summary>${t('methodology')}</summary><dl class="rules">
            <dt>${t('tests')}</dt><dd>${tests}</dd>
            <dt>${t('passes')}</dt><dd>${passes}</dd>
            <dt>${t('shows')}</dt><dd>${shows}</dd>
          </dl></details>
          <div class="suite-foot">
            <span class="suite-meta"><span>${t('questionsN', { n: s.questions })}</span><span class="subtle">${t('costPerRun', { cost: usd(s.estimate_usd) })}</span></span>
            <button type="button" class="btn ${s.running ? '' : 'primary'}" data-run="${s.suite}" ${s.running ? 'disabled' : ''}>${s.running ? t('running') : `${t('run')}<span aria-hidden="true">↗</span>`}</button>
          </div>
        </article>`
      })
      .join('')
    equalizeSuites()
  }

  const bar = (w, h = 12) => `<span class="sk" style="width:${w};height:${h}px"></span>`

  function suitesSkeleton() {
    return `<article class="suite" aria-hidden="true">
        <div class="suite-index">${bar('28px', 28)}${bar('45%', 10)}</div>${bar('75%', 24)}
        <div class="sk-stack">${bar('95%')}${bar('70%')}</div>
        <div class="suite-foot">${bar('45%', 10)}<span class="sk btn-sk"></span></div>
      </article>`.repeat(3)
  }

  function runsSkeleton() {
    const item = `<div class="run run-sk" aria-hidden="true"><div class="sk-stack">${bar('35%', 10)}${bar('70%', 14)}${bar('55%', 10)}</div></div>`
    return `<div class="history" aria-hidden="true"><div class="history-heading">${bar('160px', 16)}</div><div class="list">${item.repeat(4)}</div></div>`
  }

  function questionsSkeleton() {
    const row = `<tr aria-hidden="true"><td>${bar('70%', 14)}</td><td>${bar('50%', 14)}</td><td>${bar('60%', 14)}</td><td style="text-align:right"><span class="sk" style="width:72px;height:28px;display:inline-block;border-radius:var(--radius-control)"></span></td></tr>`
    return `<div class="toolbar">${'<span class="sk" style="width:110px;height:36px;border-radius:var(--radius-control)"></span>'.repeat(3)}</div>
      <div class="card" style="padding:6px 20px"><table class="questions"><tbody>${row.repeat(6)}</tbody></table></div>`
  }

  function pagedRuns() {
    const pages = Math.max(1, Math.ceil(runs.length / RUNS_PAGE))
    runPage = Math.min(runPage, pages)
    return runs.slice((runPage - 1) * RUNS_PAGE, runPage * RUNS_PAGE)
  }

  // Previous, the page numbers (first, last and the ones beside the current, gaps as …), next.
  function runPager() {
    const pages = Math.ceil(runs.length / RUNS_PAGE)
    if (pages <= 1) return ''
    const shown = Array.from({ length: pages }, (_, i) => i + 1).filter((n) => n === 1 || n === pages || Math.abs(n - runPage) <= 1)
    const numbers = shown
      .map((n, i) => `${i > 0 && n - shown[i - 1] > 1 ? '<span class="page-gap">…</span>' : ''}<button type="button" data-page="${n}" aria-label="${t('page', { n })}" ${n === runPage ? 'aria-current="page"' : ''}>${n}</button>`)
      .join('')
    return `<nav class="pager" aria-label="${t('pages')}">
      <button type="button" data-page="${runPage - 1}" aria-label="${t('previousPage')}" ${runPage === 1 ? 'disabled' : ''}>${icon('chevron-left')}</button>
      <div class="page-numbers">${numbers}</div>
      <button type="button" data-page="${runPage + 1}" aria-label="${t('nextPage')}" ${runPage === pages ? 'disabled' : ''}>${icon('chevron-right')}</button>
    </nav>`
  }

  // A run's status as its dot's colour and as its label; a finished run is the default.
  const RUN_STATE = { failed: 'fail', stopped: 'neutral', running: 'live' }
  const RUN_LABEL = { running: 'running', failed: 'failed', stopped: 'stopped' }

  function runItem(r, animate = true) {
    const state = RUN_STATE[r.status] ?? 'pass'
    const selected = Boolean(current && plain(current.id) === plain(r.id))
    const label = t(RUN_LABEL[r.status] ?? 'completed')
    return `<button type="button" class="run ${animate ? 'fade' : ''}" data-id="${plain(r.id)}" style="view-transition-name: run-${plain(r.id)}" aria-current="${selected}" aria-expanded="${selected}" ${selected ? 'aria-controls="detail"' : ''}>
      <span class="run-name"><strong>${esc(TEXT[lang].suites[r.suite]?.[0] ?? r.suite)}</strong><span class="subtle">v${esc(r.version)} · ${esc(r.commit)}</span></span>
      <time>${esc(when(r.started_at))}</time>
      <span class="status ${state}"><span class="status-dot" aria-hidden="true"></span>${label}</span>
      <span class="run-count">${r.total}/${r.planned}</span>
      <span class="run-cost">${usd(r.cost_usd)}</span><span class="run-action">${t(selected ? 'closeResults' : 'viewResults')}<span class="run-arrow" aria-hidden="true">${selected ? '−' : '→'}</span></span>
    </button>`
  }

  function change(a, b) {
    if (!b) return ''
    if (a.passed && !b.passed) return `<span class="pill pass">${t('fixed')}</span>`
    if (!a.passed && b.passed) return `<span class="pill fail">${t('broke')}</span>`
    if (a.score != null && b.score != null && a.score !== b.score) return a.score > b.score ? `<span class="pill pass">${t('better')}</span>` : `<span class="pill fail">${t('worse')}</span>`
    return ''
  }

  function empty(title, body) {
    return `<div class="empty fade"><span class="empty-mark" aria-hidden="true">—</span><h3>${title}</h3><p class="muted">${body}</p></div>`
  }

  function runHeading(run) {
    const score = t('passedOf', { passed: run.passed, total: run.total })
    if (run.status === 'running') return t('runningOf', { done: run.total, planned: run.planned })
    if (run.status === 'failed') return t('failed')
    if (run.status !== 'stopped') return score
    return run.total ? `${t('stopped')} · ${score}` : t('stopped')
  }

  // The approval rate waits for the run to end; a run with nothing scored shows a dash.
  function rateHtml(live, rate) {
    if (live) return `<strong class="pending">${t('ratePending')}</strong><span>${t('ratePendingNote')}</span>`
    if (rate == null) return `<strong>—</strong><span>${t('noScore')}</span>`
    return `<strong>${rate}<small>%</small></strong><span>${t('approval')}</span>`
  }

  function scoreTrack(run) {
    return `<div class="score-track" role="img" aria-label="${t('passedOf', { passed: run.passed, total: run.total })}">${run.cases.map((c) => `<span class="${c.passed ? 'hit' : 'miss'}"></span>`).join('')}</div>`
  }

  // A run with no case yet: still waiting for the first, or stopped before it.
  function noCasesHtml(run, live) {
    if (live) return `<div class="sk-stack">${bar('60%', 14)}${bar('35%', 10)}</div><p>${t('waitingTitle')}</p>`
    const cancelled = run.status === 'stopped'
    return `<h4>${t(cancelled ? 'cancelledTitle' : 'stoppedTitle')}</h4><p>${t(cancelled ? 'cancelledBody' : 'stoppedBody')}</p>`
  }

  function promptButton(run) {
    return run.prompt_text ? ` <button type="button" class="link-btn" data-prompt>${t('showPrompt')}</button>` : ''
  }

  function promptText(run) {
    return run.prompt_text ? `<pre class="prompt-text" hidden>${esc(run.prompt_text)}</pre>` : ''
  }

  // The run's header: status, progress and facts. Redrawn alone while the run goes on.
  function runHead(animate = false) {
    const live = current.status === 'running'
    const pct = current.planned ? Math.round((current.total / current.planned) * 100) : 0
    const summary = Object.entries(current.summary || {})
      .map(([k, v]) => `<div><dt>${esc(TEXT[lang].metrics[k] ?? k)}</dt><dd>${esc(v)}</dd></div>`)
      .join('')
    const heading = runHeading(current)
    const rate = current.total ? Math.round(current.passed / current.total * 100) : null
    return `<section class="run-report ${animate ? 'fade' : ''}" id="run-head">
      <div class="report-title"><div><span class="tag">${t('selected')}</span><h3 id="report-title" tabindex="-1">${esc(TEXT[lang].suites[current.suite]?.[0] ?? current.suite)}</h3><p class="muted">${heading}</p></div>
        <div class="report-actions"><button type="button" class="btn sm" id="close-results" aria-label="${t('closeResults')}">×</button>${live ? `<button type="button" class="btn sm" data-stop="${plain(current.id)}">${t('stop')}</button>` : ''}</div>
      </div>
      <div class="report-metrics"><div class="report-rate">${rateHtml(live, rate)}</div><div><strong>${current.total}<small>/ ${current.planned}</small></strong><span>${t('inspected')}</span></div><div><strong>${usd(current.cost_usd)}</strong><span>${t('cost')}</span></div></div>
      ${live ? `<div class="bar live"><i style="width:${Math.max(pct, 4)}%"></i></div>` : ''}
      ${current.error ? `<p class="error-notice">${esc(current.error)}</p>` : ''}
      ${current.cases.length ? scoreTrack(current) : `<div class="report-notice">${noCasesHtml(current, live)}</div>`}
      <details class="run-meta"><summary>${t('technical')}</summary>
        <dl class="facts">
          <div><dt>${t('started')}</dt><dd>${esc(when(current.started_at))}</dd></div>
          <div><dt>${t('version')}</dt><dd>v${esc(current.version)} · ${esc(current.commit)}</dd></div>
          <div class="fact-models"><dt>${t('models')}</dt><dd>${esc(current.models.join(', ') || '—')}</dd></div>
          <div class="fact-prompt"><dt>${t('prompt')}</dt><dd>${esc(current.prompt || '—')}${promptButton(current)}</dd></div>
          ${summary}
        </dl>
        ${promptText(current)}
      </details>
    </section>`
  }


  // One case: its row and the hidden details under it.
  function caseRows(c, o, i) {
    return `<article class="case ${c.passed ? 'case-pass' : 'case-fail'}">
      <button type="button" class="case-toggle" data-case="${i}" aria-expanded="false" aria-controls="case-${i}">
        <span class="case-number">${String(i + 1).padStart(2, '0')}</span>
        <span class="case-question"><span class="subtle">${esc(c.extra?.game || t('question'))}</span><strong>${esc(c.input)}</strong></span>
        <span class="case-verdict"><span class="${c.passed ? 'pass' : 'fail'}">${c.passed ? t('approved') : t('rejected')}</span>${scoreLine(c, o)}${o ? change(c, o) : ''}</span>
        <span class="case-chevron" aria-hidden="true">+</span>
      </button>
      ${c.reason ? `<p class="case-reason">${esc(c.reason)}</p>` : ''}
      <div class="case-detail" id="case-${i}" data-for="${i}" hidden>
        <div class="detail-content"><section><h4>${t('expected')}</h4><pre>${esc(expectedText(c))}</pre></section><section><h4>${t('answer')}</h4><pre>${esc(c.output || '—')}</pre></section></div>
        ${o ? `<section class="answer-before"><h4>${t('answerBefore')}</h4><pre>${esc(o.output || '—')}</pre></section>` : ''}
        <p class="subtle">${esc(c.models.join(', '))} · ${usd(c.cost_usd)}</p>
      </div>
    </article>`
  }

  function runDetail() {
    if (!current) return empty(t('pickTitle'), t('pickBody'))
    const same = runs.filter((r) => r.suite === current.suite && plain(r.id) !== plain(current.id) && r.status === 'done')
    const before = Object.fromEntries((other?.cases ?? []).map((c) => [c.input, c]))
    let cases = current.cases.map((c) => ({ c, o: other ? before[c.input] : null }))
    if (other && onlyChanges) cases = cases.filter(({ c, o }) => !o || change(c, o))
    return `${runHead(true)}

      <div ${current.cases.length ? '' : 'hidden'}>
      ${same.length ? `<div class="toolbar comparison-toolbar">
        <label class="comparison-field">${t('compare')}
          <select id="compare"><option value="">${t('noComparison')}</option>${same.map((r) => `<option value="${plain(r.id)}" ${other && plain(other.id) === plain(r.id) ? 'selected' : ''}>${esc(when(r.started_at))} · v${esc(r.version)} · ${r.passed}/${r.total}</option>`).join('')}</select>
        </label>
        ${other ? `<label class="check"><input type="checkbox" id="only" ${onlyChanges ? 'checked' : ''}><span>${t('onlyChanged')}</span></label>` : ''}
      </div>` : ''}
      ${!cases.length ? empty(t('unchanged'), t('unchangedHint')) : ''}
      <div id="cases" class="cases" ${cases.length ? '' : 'hidden'}>${cases.map(({ c, o }, i) => caseRows(c, o, i)).join('')}</div>
      </div>`
  }

  // Opening or closing a run morphs the layout: the list narrows to a column, each row slides to
  // its new place and the results fade in beside it. Without View Transitions (or with reduced
  // motion) the page just switches.
  function morph(update) {
    if (!document.startViewTransition || matchMedia('(prefers-reduced-motion: reduce)').matches) {
      update()
      return Promise.resolve()
    }
    return document.startViewTransition(update).finished
  }

  function drawRuns(animate = true) {
    const el = document.getElementById('tab')
    if (!runs.length) {
      el.innerHTML = empty(t('noRunsTitle'), t('noRunsBody'))
      return
    }
    el.innerHTML = `<div id="runs-layout" class="runs-layout ${current ? 'has-selection' : ''}"><div class="history"><div class="history-heading"><h3>${t('history')}</h3><p class="subtle">${t('historyHint')}</p></div><div class="list"><div class="run-cols" aria-hidden="true"><span>${t('colSuite')}</span><span>${t('colStarted')}</span><span>${t('colStatus')}</span><span>${t('colQuestions')}</span><span>${t('colCost')}</span><span></span></div>${pagedRuns().map((r) => runItem(r, animate)).join('')}</div>${runPager()}</div>${current ? `<div id="detail" role="region" aria-labelledby="report-title">${runDetail()}</div>` : ''}</div>`
  }

  function asText(value, kind) {
    if (kind === 'list') return (value || []).join(', ')
    if (kind === 'lines') return (value || []).join('\n')
    if (kind === 'groups') return (value || []).map((g) => g.join(', ')).join('\n')
    return value ?? ''
  }

  function fromText(text, kind) {
    const v = text.trim()
    if (kind === 'list') return v ? v.split(',').map((s) => s.trim()).filter(Boolean) : []
    if (kind === 'lines') return v ? v.split('\n').map((s) => s.trim()).filter(Boolean) : []
    if (kind === 'groups') return v ? v.split('\n').map((l) => l.split(',').map((s) => s.trim()).filter(Boolean)).filter((g) => g.length) : []
    if (kind === 'number') return Number(v) || 0
    return v
  }

  function questionForm(q) {
    const data = q?.data ?? {}
    return `<form id="qform" method="dialog">
      <div class="dialog-head"><h3 id="qdialog-title">${editing !== 'new' ? t('editQuestion') : t('newQuestion')}</h3>
        <button type="button" class="btn sm" id="qclose" aria-label="${t('cancel')}">${icon('close')}</button></div>
      ${FIELDS[qsuite]
        .map(([key, label, kind]) => {
          const v = esc(asText(data[key], kind))
          const required = REQUIRED[qsuite].includes(key)
          const text = `${esc(TEXT[lang].fields[label])}${required ? ` <span class="required" title="${t('requiredField')}">*</span>` : ''}`
          if (kind === 'game' || kind === 'gameref') return `<div class="field"><span>${text}</span>${pickerHtml(kind, data)}</div>`
          const req = required ? ' required' : ''
          return `<label class="field"><span>${text}</span>${kind === 'text' || kind === 'lines' || kind === 'groups' ? `<textarea name="${key}"${req}>${v}</textarea>` : `<input name="${key}" value="${v}"${kind === 'number' ? ' type="number" min="1"' : ''}${req}>`}</label>`
        })
        .join('')}
      ${editing !== 'new' ? `<label class="muted"><input type="checkbox" name="active" ${q?.active ? 'checked' : ''}> ${t('active')}</label>` : ''}
      <div class="row" style="justify-content:flex-end;margin-top:12px">
        <button type="button" class="btn" id="qcancel">${t('cancel')}</button>
        <button class="btn primary">${t('save')}</button>
      </div>
    </form>`
  }

  async function drawQuestions() {
    const el = document.getElementById('tab')
    el.innerHTML = questionsSkeleton()
    const list = await api(`/api/questions/${qsuite}`)
    qlist = list
    const main = (q) => esc(q.data.question || q.data.message || '')
    el.innerHTML = `<div class="toolbar">
        ${SUITES
          .map((s) => `<button type="button" class="chip ${s === qsuite ? 'active' : ''}" data-qsuite="${s}">${TEXT[lang].suites[s][0]}<span class="count">${suites.find((x) => x.suite === s)?.questions ?? ''}</span></button>`)
          .join('')}
        <span style="flex:1"></span>
        <button type="button" class="btn" id="qadd">${icon('plus')}${t('add')}</button>
      </div>
      ${list.length ? '' : empty(t('noQuestionsTitle'), t('noQuestionsBody'))}
      <div class="table-wrap fade" tabindex="0" role="region" aria-label="${t('questions')}" ${list.length ? '' : 'hidden'}>
        <table class="questions"><thead><tr><th>${t('question')}</th><th>${qsuite === 'scope' ? t('mustNot') : t('game')}</th><th>${t('createdAt')}</th><th></th></tr></thead>
        <tbody>${list
          .map(
            (q) => `<tr style="${q.active ? '' : 'opacity:.5'}">
            <td>${main(q)}</td>
            <td class="muted">${esc(qsuite === 'scope' ? (q.data.forbidden || []).join(', ') : q.data.name || q.data.game || '')}</td>
            <td class="muted nowrap">${when(q.created_at)}</td>
            <td class="row-actions">${questionActions(q)}</td>
          </tr>`,
          )
          .join('')}</tbody></table>
      </div>`
  }

  // While a run goes on, only what changed is redrawn: the run's item in the list, its header and
  // the new question panels at the end of the report. Open rows, the comparison and the scroll stay put.
  // The real questions: what players asked, Nexo's answer, and the passages the search finds now.
  const REAL_FILTERS = {
    all: () => true,
    uncited: (q) => q.source !== 'guide',
    noguide: (q) => !q.passages,
    new: (q) => !q.in_eval,
  }

  // The passages found now for one question: a skeleton while the search runs, then the list.
  function realPassages(q) {
    const found = realFound[q.id]
    if (!found) return `<p class="muted">${t('searchAgain')}…</p>`
    if (found === 'loading')
      return `<p class="muted">${t('searching')}</p><span class="sk" style="width:92%;height:14px"></span><span class="sk" style="width:70%;height:14px"></span><span class="sk" style="width:84%;height:14px"></span>`
    return `<div class="fade"><p class="muted">${esc(t('searchedAs').replace('{q}', found.english || q.question))}</p>
      ${found.passages.length ? found.passages.map((p, i) => `<section class="real-passage"><h4>${i + 1}. ${esc(p.source)} — ${esc(p.heading)}</h4><pre>${esc(p.content)}</pre></section>`).join('') : `<p class="muted">${t('noPassagesNow')}</p>`}</div>`
  }

  // Every row has its detail (Nexo's answer, the passages found now) right below it, collapsed:
  // opening one only unfolds it, so the table never redraws under the pointer.
  function realRow(q) {
    const open = realOpen.has(q.id)
    const name = `real-${plain(q.id)}`
    return `<tr style="view-transition-name: ${name}">
        <td><button type="button" class="link-btn" data-real-open="${esc(q.id)}" aria-expanded="${open}" aria-controls="${name}-detail">${esc(q.question)}</button></td>
        <td class="muted">${esc(q.name || '')}</td>
        <td class="muted">${q.passages || '—'}</td>
        <td class="muted">${t({ guide: 'sourceGuide', web: 'sourceWeb', none: 'sourceNone' }[q.source])}</td>
        <td class="muted nowrap">${when(q.asked_at)}</td>
        <td class="nowrap real-actions" data-real-actions="${esc(q.id)}">${realActions(q)}</td>
      </tr>
      <tr class="real-detail ${open ? 'open' : ''}" id="${name}-detail" style="view-transition-name: ${name}-detail">
        <td colspan="6"><div class="real-collapse"><div><div class="detail-content">
          <section><h4>${t('answerNow')}</h4><pre>${esc(q.answer || '—')}</pre></section>
          <section><h4>${t('passagesNow')}</h4><div data-real-found="${esc(q.id)}">${realPassages(q)}</div></section>
        </div></div></div></td>
      </tr>`
  }

  function realActions(q) {
    return `<div class="real-buttons"><button type="button" class="btn sm" data-real-search="${esc(q.id)}">${icon('search')}${t('searchAgain')}</button>
      ${q.in_eval ? `<span class="in-golden">${icon('check')}${t('inEval')}</span>` : `<button type="button" class="btn sm" data-real-eval="${esc(q.id)}">${icon('plus')}${t('toEval')}</button>`}</div>`
  }

  async function drawReal(animate = true) {
    const el = document.getElementById('tab')
    if (!realList) {
      el.innerHTML = questionsSkeleton()
      realList = await api('/api/real')
      drawTabs()
    }
    const list = realList.filter(REAL_FILTERS[realFilter])
    el.innerHTML = `<p class="subtle">${t('realHint')}</p>
      <div class="toolbar">
        ${Object.keys(REAL_FILTERS)
          .map((f) => `<button type="button" class="chip ${f === realFilter ? 'active' : ''}" data-real-filter="${f}" aria-pressed="${f === realFilter}">${t({ all: 'realAll', uncited: 'realUncited', noguide: 'realNoGuide', new: 'realNew' }[f])}<span class="count">${realList.filter(REAL_FILTERS[f]).length}</span></button>`)
          .join('')}
      </div>
      ${list.length ? '' : empty(t('realEmptyTitle'), t('realEmptyBody'))}
      <div class="table-wrap ${animate ? 'fade' : ''}" tabindex="0" role="region" aria-label="${t('real')}" ${list.length ? '' : 'hidden'}>
        <table class="questions real"><thead><tr><th>${t('question')}</th><th>${t('game')}</th><th>${t('colGuide')}</th><th>${t('colSource')}</th><th>${t('colAsked')}</th><th></th></tr></thead>
        <tbody>${list.map(realRow).join('')}</tbody></table>
      </div>`
  }

  function toggleReal(id, open = !realOpen.has(id)) {
    open ? realOpen.add(id) : realOpen.delete(id)
    const name = `real-${plain(id)}`
    document.getElementById(`${name}-detail`)?.classList.toggle('open', open)
    document.querySelector(`[data-real-open="${CSS.escape(id)}"]`)?.setAttribute('aria-expanded', open)
  }

  function fillFound(id) {
    const q = realList.find((x) => x.id === id)
    const box = document.querySelector(`[data-real-found="${CSS.escape(id)}"]`)
    if (q && box) box.innerHTML = realPassages(q)
  }

  async function searchReal(id) {
    const q = realList.find((x) => x.id === id)
    realFound[id] = 'loading'
    fillFound(id)
    toggleReal(id, true)
    try {
      realFound[id] = await api('/api/real/search', { method: 'POST', body: { game: q.game, question: q.question } })
    } catch (e) {
      delete realFound[id]
      fillFound(id)
      throw e
    }
    fillFound(id)
  }

  let promoting = null

  // Edit with the pencil, delete with the bin. Only a question no run asked can go (the server
  // refuses the others); for one with history the bin is off and says why.
  function questionActions(q) {
    const id = plain(q.id)
    const label = q.active ? t('edit') : `${t('edit')} (${t('archived')})`
    const bin = `<button type="button" class="btn sm icon-only danger-ghost" data-delete="${id}" aria-label="${t('deleteQuestion')}" ${q.used ? 'disabled' : `title="${t('deleteQuestion')}"`}>${icon('trash')}</button>`
    return `<div class="row-buttons"><button type="button" class="btn sm icon-only" data-edit="${id}" aria-label="${esc(label)}" title="${esc(label)}">${icon('edit')}</button>
      ${q.used ? `<span title="${esc(t('cannotDelete').replace('{n}', q.used))}">${bin}</span>` : bin}</div>`
  }

  async function deleteQuestion(id) {
    if (!(await ask(t('deleteTitle'), t('deleteBody'), t('deleteQuestion')))) return
    await api(`/api/questions/${qsuite}/${id}`, { method: 'DELETE' })
    realList = null
    toast(t('deleted'))
    await drawQuestions()
    refresh()
  }

  function realToEval(id) {
    const q = realList.find((x) => x.id === id)
    promoting = id
    qsuite = 'retrieval'
    openQuestion('new', { data: { game: q.game, name: q.name, question: q.question, terms: [], relevant: [] } })
  }

  // The app's success toast (apps/web/src/ui/toast.tsx), with its stylesheet: the same markup and
  // the same timing, so a confirmation here looks like one in the app.
  let toastTimers = []
  function toast(text) {
    const host = document.getElementById('toast-host')
    for (const timer of toastTimers) clearTimeout(timer)
    host.innerHTML = `<div class="toast success" role="status"><span class="burst" aria-hidden="true">${'<i></i>'.repeat(10)}</span><span class="toast-mark">${icon('check')}</span><span class="toast-text">${esc(text)}</span></div>`
    const el = host.firstElementChild
    requestAnimationFrame(() => el.classList.add('show'))
    const leave = () => {
      el.classList.remove('show')
      el.classList.add('leave')
      toastTimers = [setTimeout(() => el.remove(), 350)]
    }
    el.addEventListener('click', leave)
    toastTimers = [setTimeout(leave, 4200)]
  }

  // After a promoted question is saved, only its row changes.
  function promoted() {
    const q = realList?.find((x) => x.id === promoting)
    promoting = null
    if (!q) return
    q.in_eval = true
    toast(t('promoted'))
    const cell = document.querySelector(`[data-real-actions="${CSS.escape(q.id)}"]`)
    if (cell) cell.innerHTML = realActions(q)
    for (const chip of document.querySelectorAll('[data-real-filter]')) {
      chip.querySelector('.count').textContent = realList.filter(REAL_FILTERS[chip.dataset.realFilter]).length
    }
  }

  async function poll() {
    const before = JSON.stringify(suites.map((s) => [s.suite, s.running, s.questions, s.estimate_usd]))
    const [fresh, freshSuites] = await Promise.all([api('/api/runs'), api('/api/suites')])
    suites = freshSuites
    if (JSON.stringify(suites.map((s) => [s.suite, s.running, s.questions, s.estimate_usd])) !== before) drawSuites()
    drawTabs()
    const list = document.querySelector('.list')
    if (tab !== 'runs' || !list || fresh.length !== runs.length) {
      runs = fresh
      if (current) current = await api(`/api/runs/${plain(current.id)}`)
      if (tab === 'runs') drawRuns()
      return
    }
    for (const r of fresh) {
      const old = runs.find((x) => x.id === r.id)
      const item = list.querySelector(`[data-id="${plain(r.id)}"]`)
      if (item && JSON.stringify(old) !== JSON.stringify(r)) item.outerHTML = runItem(r, false)
    }
    runs = fresh
    drawOverview()
    if (current) await pollRun()
  }

  // The open run's report: redrawn whole when its state changed, else only the new cases are added.
  async function pollRun() {
    const mine = runs.find((r) => plain(r.id) === plain(current.id))
    if (!mine || (mine.status === current.status && mine.total === current.cases.length)) return
    const had = current.cases.length
    const was = current.status
    current = await api(`/api/runs/${plain(current.id)}`)
    const rows = document.getElementById('cases')
    if (was !== current.status || had === 0 || !rows || (other && onlyChanges)) {
      document.getElementById('detail').innerHTML = runDetail()
      return
    }
    document.getElementById('run-head').outerHTML = runHead()
    const before2 = Object.fromEntries((other?.cases ?? []).map((c) => [c.input, c]))
    rows.insertAdjacentHTML(
      'beforeend',
      current.cases
        .slice(had)
        .map((c, i) => caseRows(c, other ? before2[c.input] : null, had + i))
        .join(''),
    )
  }

  async function refresh() {
    runs = await api('/api/runs')
    const selected = current?.id
    if (selected) current = await api(`/api/runs/${plain(selected)}`)
    suites = await api('/api/suites')
    drawSuites()
    drawTabs()
    if (tab === 'runs') drawRuns()
  }

  function ask(title, body, go = t('run')) {
    const d = document.getElementById('confirm')
    document.getElementById('confirm-go').textContent = go
    document.getElementById('confirm-title').textContent = title
    document.getElementById('confirm-body').textContent = body
    d.showModal()
    return new Promise((resolve) => {
      const done = (answer) => {
        d.close()
        resolve(answer)
      }
      document.getElementById('confirm-go').onclick = () => done(true)
      document.getElementById('confirm-cancel').onclick = () => done(false)
    })
  }

  // Where the viewer is, in the address (in English), so a reload opens the same tab, the same
  // suite of the golden set and the same filter of the real questions.
  const TAB_PARAM = { runs: 'runs', questions: 'golden-set', real: 'real-questions' }
  const FILTER_PARAM = { all: 'all', uncited: 'no-guide-cited', noguide: 'no-passages', new: 'not-in-golden-set' }
  const fromParam = (map, value) => Object.keys(map).find((key) => map[key] === value)

  function readLocation() {
    const params = new URLSearchParams(location.search)
    tab = fromParam(TAB_PARAM, params.get('tab')) ?? 'runs'
    if (SUITES.includes(params.get('suite'))) qsuite = params.get('suite')
    realFilter = fromParam(FILTER_PARAM, params.get('filter')) ?? 'all'
  }

  function saveLocation() {
    const params = new URLSearchParams({ tab: TAB_PARAM[tab] })
    if (tab === 'questions') params.set('suite', qsuite)
    if (tab === 'real' && realFilter !== 'all') params.set('filter', FILTER_PARAM[realFilter])
    history.replaceState(null, '', `${location.pathname}?${params}`)
  }

  function selectTab(name) {
    tab = name
    saveLocation()
    for (const b of document.querySelectorAll('[data-tab]')) b.setAttribute('aria-selected', b.dataset.tab === name)
  }

  async function switchLang(next) {
    lang = next
    try {
      localStorage.setItem('evals:lang', lang)
    } catch {}
    translateStatic()
    drawSuites()
    drawTabs()
    return drawTab()
  }

  function openTab(name) {
    selectTab(name)
    editing = null
    return drawTab()
  }

  function drawTab() {
    return { runs: drawRuns, questions: drawQuestions, real: drawReal }[tab]()
  }

  async function startRun(suite) {
    const s = suites.find((x) => x.suite === suite)
    const title = TEXT[lang].suites[s.suite][0]
    const ok = await ask(t('confirmTitle', { suite: title }), t('confirmBody', { n: s.questions, cost: usd(s.estimate_usd) }))
    if (!ok) return
    await api('/api/runs', { method: 'POST', body: { suite: s.suite } })
    selectTab('runs')
    await new Promise((r) => setTimeout(r, 800))
    runs = await api('/api/runs')
    const mine = runs.find((r) => r.suite === s.suite && r.status === 'running')
    if (mine) current = await api(`/api/runs/${plain(mine.id)}`)
    return refresh()
  }

  function togglePrompt(el) {
    const text = el.closest('.run-meta').querySelector('.prompt-text')
    text.hidden = !text.hidden
    el.textContent = t(text.hidden ? 'showPrompt' : 'hidePrompt')
  }

  async function stopRun(id) {
    if (!(await ask(t('stopTitle'), t('stopBody'), t('stop')))) return
    await api(`/api/runs/${id}/stop`, { method: 'POST', body: {} })
    return refresh()
  }

  async function closeRun() {
    const previous = plain(current.id)
    current = null
    other = null
    await morph(() => drawRuns(false))
    document.querySelector(`[data-id="${previous}"]`)?.focus({ preventScroll: true })
  }

  async function openRun(id) {
    const opening = !current
    current = await api(`/api/runs/${id}`)
    other = null
    await (opening ? morph(() => drawRuns(false)) : Promise.resolve(drawRuns(false)))
    document.getElementById('report-title').focus({ preventScroll: true })
    const target = matchMedia('(max-width: 760px)').matches ? 'detail' : 'runs-layout'
    document.getElementById(target).scrollIntoView({ block: 'start' })
  }

  function toggleCase(index) {
    const d = document.querySelector(`[data-for="${index}"]`)
    d.hidden = !d.hidden
    document.querySelector(`[data-case="${index}"]`).setAttribute('aria-expanded', !d.hidden)
  }

  function openQuestionSuite(name) {
    qsuite = name
    saveLocation()
    editing = null
    return drawQuestions()
  }

  // What a button does, by what marks it; the first match wins.
  const CLICKS = [
    [(el) => el.id === 'retry', () => refresh().catch(showError)],
    [(el) => el.dataset.lang, (el) => switchLang(el.dataset.lang)],
    [(el) => el.dataset.tab, (el) => openTab(el.dataset.tab)],
    [(el) => el.dataset.run, (el) => startRun(el.dataset.run)],
    [(el) => 'prompt' in el.dataset, (el) => togglePrompt(el)],
    [(el) => el.dataset.stop, (el) => stopRun(el.dataset.stop)],
    [(el) => el.id === 'close-results' || (el.dataset.id && current && el.dataset.id === plain(current.id)), () => closeRun()],
    [(el) => el.dataset.id, (el) => openRun(el.dataset.id)],
    [(el) => el.dataset.case !== undefined, (el) => toggleCase(el.dataset.case)],
    [
      (el) => el.dataset.page,
      (el) => {
        runPage = Number(el.dataset.page)
        return drawRuns(false)
      },
    ],
    [(el) => el.dataset.qsuite, (el) => openQuestionSuite(el.dataset.qsuite)],
    [(el) => el.id === 'qadd', () => openQuestion('new')],
    [(el) => el.dataset.delete, (el) => deleteQuestion(el.dataset.delete).catch(showError)],
    [
      (el) => el.dataset.realFilter,
      (el) => {
        realFilter = el.dataset.realFilter
        saveLocation()
        return morph(() => drawReal(false))
      },
    ],
    [
      (el) => el.dataset.realOpen,
      (el) => toggleReal(el.dataset.realOpen),
    ],
    [(el) => el.dataset.realSearch, (el) => searchReal(el.dataset.realSearch).catch(showError)],
    [(el) => el.dataset.realEval, (el) => realToEval(el.dataset.realEval)],
    [(el) => el.dataset.edit, (el) => openQuestion(el.dataset.edit)],
    [(el) => el.id === 'qcancel' || el.id === 'qclose', () => closeQuestion()],
  ]

  document.addEventListener('click', async (e) => {
    const el = e.target.closest('button')
    if (!el) return
    const action = CLICKS.find(([marks]) => marks(el))
    return action?.[1](el)
  })

  document.addEventListener('submit', async (e) => {
    if (e.target.id !== 'qform') return
    e.preventDefault()
    const form = new FormData(e.target)
    const data = Object.fromEntries(FIELDS[qsuite].map(([key, , kind]) => [key, fromText(String(form.get(key) ?? ''), kind)]))
    const picker = FIELDS[qsuite].find(([, , kind]) => kind === 'game' || kind === 'gameref')
    if (picker) {
      if (!form.get('game')) {
        const p = e.target.querySelector('.picker')
        p.querySelector('.pick-error').hidden = false
        p.querySelector('.game-search').focus()
        return
      }
      data.game = String(form.get('game'))
      if (picker[2] === 'gameref') data.name = String(form.get('name'))
    }
    if (editing === 'new') await api(`/api/questions/${qsuite}`, { method: 'POST', body: { data } })
    else await api(`/api/questions/${qsuite}/${editing}`, { method: 'PUT', body: { data, active: form.get('active') === 'on' } })
    closeQuestion()
    if (tab === 'real') promoted()
    else drawQuestions()
    refresh()
  })

  document.getElementById('qdialog').addEventListener('close', (e) => {
    editing = null
    e.target.innerHTML = ''
  })
  // A click on the backdrop (outside the box) closes it, like Escape.
  document.getElementById('qdialog').addEventListener('mousedown', (e) => {
    if (e.target === e.currentTarget) closeQuestion()
  })

  // The game picker: search as the name is typed, pick from the list with the mouse or the keys.
  let searchTimer = 0
  let searchVersion = 0
  const pickerOf = (el) => el.closest?.('.picker')

  function setActive(picker, index) {
    picker.active = index
    const options = [...picker.querySelectorAll('[role=option]')]
    for (const [i, o] of options.entries()) o.setAttribute('aria-selected', String(i === index))
    options[index]?.scrollIntoView({ block: 'nearest' })
  }

  function showList(picker, html) {
    const list = picker.querySelector('.options')
    list.innerHTML = html
    list.hidden = false
    picker.querySelector('.game-search').setAttribute('aria-expanded', 'true')
  }

  function hideList(picker) {
    picker.querySelector('.options').hidden = true
    picker.querySelector('.game-search').setAttribute('aria-expanded', 'false')
    picker.active = -1
  }

  function choose(picker, index) {
    const g = picker.found?.[index]
    if (!g) return
    picker.querySelector('[name=game]').value = picker.dataset.kind === 'gameref' ? `game:${g.id}` : g.name
    picker.querySelector('[name=name]').value = g.name
    const input = picker.querySelector('.game-search')
    input.value = ''
    input.readOnly = true
    const chip = picker.querySelector('.pick-chip')
    chip.innerHTML = chipHtml(g)
    chip.hidden = false
    picker.classList.add('has-pick')
    picker.querySelector('.pick-error').hidden = true
    hideList(picker)
  }

  function clearPick(picker) {
    picker.querySelector('[name=game]').value = ''
    picker.querySelector('[name=name]').value = ''
    picker.querySelector('.pick-chip').hidden = true
    picker.classList.remove('has-pick')
    const input = picker.querySelector('.game-search')
    input.readOnly = false
    input.focus()
  }

  document.addEventListener('input', (e) => {
    const input = e.target.closest('.game-search')
    if (!input) return
    const picker = pickerOf(input)
    clearTimeout(searchTimer)
    const version = ++searchVersion
    const q = input.value.trim()
    picker.classList.remove('is-searching')
    if (q.length < 2) {
      picker.found = []
      if (q) showList(picker, `<p class="options-note">${t('typeMore')}</p>`)
      else hideList(picker)
      return
    }
    picker.classList.add('is-searching')
    // Skeleton only the first time; later the last answer stays on screen while the next loads.
    if (!picker.found?.length)
      showList(picker, `<div class="options-sk">${'<div><i class="sk"></i><span><b class="sk"></b><small class="sk"></small></span></div>'.repeat(3)}</div>`)
    searchTimer = setTimeout(async () => {
      const found = await api(`/api/games?q=${encodeURIComponent(q)}`).catch(() => null)
      if (version !== searchVersion) return
      picker.classList.remove('is-searching')
      picker.found = found ?? []
      showList(
        picker,
        found?.length
          ? found
              .map(
                (g, i) =>
                  `<div role="option" aria-selected="false" data-index="${i}">${cover(g, 'option-cover')}<span><b>${esc(g.name)}</b><small>${esc(gameMeta(g))}</small></span>${icon('plus')}</div>`,
              )
              .join('')
          : `<p class="options-note">${t(found ? 'noGame' : 'searchFailed')}</p>`,
      )
      picker.active = -1
    }, 250)
  })

  // With a game picked, the field only takes deleting the pick; Enter never submits the form.
  function pickedKey(e, picker) {
    if (e.key === 'Backspace' || e.key === 'Delete') {
      e.preventDefault()
      clearPick(picker)
    } else if (e.key === 'Enter') e.preventDefault()
  }

  document.addEventListener('keydown', (e) => {
    const input = e.target.closest?.('.game-search')
    if (!input) return
    const picker = pickerOf(input)
    if (picker.classList.contains('has-pick')) return pickedKey(e, picker)
    const count = picker.querySelectorAll('[role=option]').length
    if (e.key === 'Escape' && !picker.querySelector('.options').hidden) {
      e.preventDefault()
      hideList(picker)
    } else if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && count) {
      e.preventDefault()
      const step = e.key === 'ArrowDown' ? 1 : -1
      setActive(picker, ((picker.active ?? -1) + step + count) % count)
    } else if (e.key === 'Enter') {
      // Enter picks the highlighted game; typed text never goes in.
      e.preventDefault()
      if ((picker.active ?? -1) >= 0) choose(picker, picker.active)
    }
  })

  document.addEventListener('mousedown', (e) => {
    const option = e.target.closest('.picker [role=option]')
    if (option) {
      e.preventDefault()
      choose(pickerOf(option), Number(option.dataset.index))
      return
    }
    if (e.target.closest('.picker .options')) e.preventDefault()
  })

  document.addEventListener('click', (e) => {
    const clear = e.target.closest('.pick-clear')
    if (clear) clearPick(pickerOf(clear))
  })

  // Leaving the field without picking drops what was typed: only a game from the list counts.
  document.addEventListener('focusout', (e) => {
    if (!e.target.classList?.contains('game-search')) return
    const picker = pickerOf(e.target)
    hideList(picker)
    if (!picker.classList.contains('has-pick')) e.target.value = ''
  })

  document.addEventListener('change', async (e) => {
    if (e.target.id === 'compare') {
      other = e.target.value ? await api(`/api/runs/${e.target.value}`) : null
      drawRuns()
    }
    if (e.target.id === 'only') {
      onlyChanges = e.target.checked
      drawRuns()
    }
  })

  function showError(error) {
    document.getElementById('tab').innerHTML = `<div role="alert">${empty(t('loadError'), esc(error.message))}<button type="button" class="btn" id="retry">${t('retry')}</button></div>`
    document.querySelectorAll('.sk').forEach((el) => { el.remove() })
  }

  window.addEventListener('unhandledrejection', (event) => {
    event.preventDefault()
    showError(event.reason)
  })

  // While something runs, follow it.
  setInterval(() => {
    if (runs.some((r) => r.status === 'running') || suites.some((s) => s.running)) poll()
  }, 3000)

  let suitesWidth = 0
  new ResizeObserver(([entry]) => {
    if (entry.contentRect.width === suitesWidth) return
    suitesWidth = entry.contentRect.width
    equalizeSuites()
  }).observe(document.getElementById('suites'))
  document.fonts.ready.then(equalizeSuites)

  translateStatic()
  document.getElementById('tab').innerHTML = runsSkeleton()
  document.getElementById('suites').innerHTML = suitesSkeleton()
  readLocation()
  selectTab(tab)
  refresh()
    .then(() => tab === 'runs' || drawTab())
    .catch(showError)
</script>
</body>
</html>
